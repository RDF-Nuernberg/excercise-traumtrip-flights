<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Employee - Traumtrip</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Add New Employee</h1>
            <nav>
                <a href="employees.html" class="btn btn-secondary">Back to Employees</a>
            </nav>
        </header>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <form id="add-employee-form">
            <div class="form-group">
                <label for="anrede">Salutation *</label>
                <select id="anrede" name="Anrede" required>
                    <option value="">Select salutation...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vorname">First Name *</label>
                <input type="text" id="vorname" name="Vorname" required>
            </div>

            <div class="form-group">
                <label for="nachname">Last Name *</label>
                <input type="text" id="nachname" name="Nachname" required>
            </div>

            <div class="form-group">
                <label for="strasse">Street *</label>
                <input type="text" id="strasse" name="Straße" required>
            </div>

            <div class="form-group">
                <label for="hausnummer">House Number *</label>
                <input type="text" id="hausnummer" name="Hausnummer" required>
            </div>

            <div class="form-group">
                <label for="plz">Postal Code *</label>
                <input type="number" id="plz" name="PLZ" required>
            </div>

            <div class="form-group">
                <label for="filiale">Branch *</label>
                <select id="filiale" name="Filiale" required>
                    <option value="">Select a branch...</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Employee</button>
                <a href="employees.html" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>

    <script src="add-employee.js"></script>
</body>

</html>
