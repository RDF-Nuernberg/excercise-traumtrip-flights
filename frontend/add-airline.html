<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Airline - Traumtrip</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Add New Airline</h1>
            <nav>
                <a href="airlines.html" class="btn btn-secondary">Back to Airlines</a>
            </nav>
        </header>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <form id="add-airline-form">
            <div class="form-group">
                <label for="name">Airline Name *</label>
                <input type="text" id="name" name="Name_Fluggesellschaft" required>
            </div>

            <div class="form-group">
                <label for="telefon">Phone *</label>
                <input type="tel" id="telefon" name="Telefon" required>
            </div>

            <div class="form-group">
                <label for="strasse">Street *</label>
                <input type="text" id="strasse" name="Straße" required>
            </div>

            <div class="form-group">
                <label for="hausnummer">House Number *</label>
                <input type="text" id="hausnummer" name="Hausnummer" required>
            </div>

            <div class="form-group">
                <label for="plz">Postal Code *</label>
                <input type="number" id="plz" name="PLZ" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Airline</button>
                <a href="airlines.html" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </main>

    <script src="add-airline.js"></script>
</body>

</html>
