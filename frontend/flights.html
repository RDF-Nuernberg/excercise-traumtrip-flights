<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traumtrip - Flights</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Traumtrip Flights</h1>
            <nav>
                <a href="index.html" class="btn btn-secondary" style="margin-right: 10px;">🏠 Dashboard</a>
                <a href="add-flight.html" class="btn btn-primary">Add New Flight</a>
            </nav>
        </header>

        <section>
            <div id="loading">Loading flights...</div>
            <div id="error" class="error" style="display: none;"></div>

            <table id="flights-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Flight ID</th>
                        <th>Start Airport</th>
                        <th>Destination Airport</th>
                        <th>Departure Date</th>
                        <th>Price (€)</th>
                        <th>Duration (h)</th>
                        <th>Airline</th>
                        <th>Aircraft Type</th>
                    </tr>
                </thead>
                <tbody id="flights-body">
                </tbody>
            </table>
        </section>
    </main>

    <script src="flights.js"></script>
</body>

</html>
